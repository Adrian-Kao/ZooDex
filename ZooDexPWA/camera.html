<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZooDex 拍照模式</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Arial', sans-serif;
      background-color: black;
      overflow: hidden;
    }
    .camera-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background-color: rgba(95, 124, 105, 0.8);
      color: #F0F465;
      text-align: center;
      padding: 0.5rem;
      font-size: 1.2rem;
      z-index: 2;
    }
    .camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .overlay-text {
      position: absolute;
      top: 60px;
      width: 100%;
      text-align: center;
      color: #F0F465;
      font-size: 1.3rem;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }
    .bounding-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      height: 520px;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .bounding-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 4px solid white;
    }
    .top-left { top: 0; left: 0; border-right: none; border-bottom: none; }
    .top-right { top: 0; right: 0; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
    .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }
    .capture-controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 1rem;
      z-index: 2;
    }
    .control-button {
      background-color: #5F7C69;
      color: #F0F465;
      border: none;
      border-radius: 50%;
      padding: 0.8rem 1rem;
      font-size: 1.5rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="camera-header">🔍 辨識結果：Homo sapiens</div>
  <video class="camera-preview" autoplay muted playsinline id="video"></video>
  <div class="overlay-text">That's it! Now take a picture to add this species to your observations.</div>
  <div class="bounding-frame">
    <div class="bounding-corner top-left"></div>
    <div class="bounding-corner top-right"></div>
    <div class="bounding-corner bottom-left"></div>
    <div class="bounding-corner bottom-right"></div>
  </div>
  <div class="capture-controls">
    <button class="control-button" onclick="alert('進入設定')">⚙️</button>
    <button class="control-button" onclick="takePicture()">📸</button>
    <button class="control-button" onclick="alert('開啟相簿')">🖼️</button>
  </div>

  <script>
    const video = document.getElementById('video');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }
      })
      .then(function(stream) {
        video.srcObject = stream;
      })
      .catch(function(error) {
        console.error("無法開啟攝影機：", error);
      });
    }

    function takePicture() {
      const stream = video.srcObject;
      const tracks = stream ? stream.getTracks() : [];
      tracks.forEach(track => track.stop());
      window.location.href = "result.html";
    }
  </script>
</body>
</html>
